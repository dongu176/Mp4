name: Guitar TAB Extractor Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      expected_measures:
        description: 'Expected Total Measures (0 if unknown)'
        required: false
        default: '0'

jobs:
  extract-tab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp google-genai cairosvg Pillow pillow-heif pypdf score-schema

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lilypond ffmpeg

      # GitHub Secrets에 등록된 쿠키 텍스트를 cookies.txt 파일로 복원
      - name: Create cookies.txt from Secret
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      # 파이썬 추출 메인 스크립트 실행
      - name: Run TAB Extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python extract.py --url "${{ github.event.inputs.youtube_url }}" --expected-measures ${{ github.event.inputs.expected_measures }}

      # 결과물 파일 업로드
      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab-score-outputs
          path: |
            *.pdf
            *.svg
            score.json

name: Guitar TAB Extractor Pipeline

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        default: 'https://www.youtube.com/watch?v=EXAMPLE'
      expected_measures:
        description: 'Expected Total Measures Count'
        required: false
        default: '112'

jobs:
  build-and-extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev fonts-nanum fonts-dejavu

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy pillow yt-dlp google-genai jsonschema cairosvg

      - name: Run TAB Extraction Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMPLE_SEC: '0.10'
          EXPECTED_MEASURES: ${{ github.event.inputs.expected_measures }}
        run: |
          python extract.py "${{ github.event.inputs.youtube_url }}"

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tab-score-outputs
          path: output/
